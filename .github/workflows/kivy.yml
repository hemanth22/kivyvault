name: Build Kivy Installer

on:
  push:
    branches: [ release* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy pyinstaller blowfish pycryptodome pycryptodomex

    - name: Build installer with PyInstaller
      run: |
        pyinstaller main.py --name hikeApp --onefile --windowed --add-data "hike.kv;."

    - name: Upload installer artifact
      uses: actions/upload-artifact@v3
      with:
        name: hikeApp-installer
        path: dist/hikeApp.exe
