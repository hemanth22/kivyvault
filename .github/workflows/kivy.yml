name: Build Kivy Installer

on:
  push:
    branches: [ release* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pyinstaller pycryptodome

    - name: Build installer with PyInstaller
      run: |
        python -m PyInstaller --onefile --windowed --name KivyVault --hidden-import=customtkinter main.py

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: hikeApp-installer
        path: dist/KivyVault.exe